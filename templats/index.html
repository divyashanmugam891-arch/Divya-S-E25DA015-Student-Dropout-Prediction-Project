<html>
<head>
    <title>Student Dropout Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
<h1>Student Dropout Prediction</h1>
<form method="POST">
<label>Gender</label>
<select name="gender">
    <option value="">Select</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
</select>
<label>Family Income</label>
<input type="number" step="1"  name="family_income" value="{{ form.get('family_income','') }}">
<label>Study Hours</label>
<input type="number" step="0.01" name="study_hours" value="{{ form.get('study_hours','') }}">
<label>Attendance</label>
<input type="number" step="0.01"  name="attendance" value="{{ form.get('attendance','') }}">
<label>Part Time Job</label>
<select name="part_time_job">
    <option value="">Select</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
</select>
<label>Scholarship</label>
<select name="scholarship">
    <option value="">Select</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
</select>
<label>Stress Index</label>
<input type="number" step="0.01" name="stress_index" value="{{ form.get('stress_index','') }}">
<label>GPA</label>
<input type="number" step="0.01" name="gpa" value="{{ form.get('gpa','') }}">
<button type="submit">Predict</button>
</form>
{% if result %}
<div class="result">
    {{ result }}
</div>
{% endif %}
</div>
</body>
</html>
